name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run stdin/stdout test
        run: |
          out=$(printf "6 7\n" | python3 kadai.py)
          test "$out" = "42"
